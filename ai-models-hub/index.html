                    '创意写作：故事和脚本',
                    '多轮对话：连贯的对话体验'
                ],
                useCases: [
                    '角色扮演和虚拟伴侣',
                    '创意故事和小说',
                    '情感咨询和陪伴',
                    '剧本和脚本创作'
                ],
                pricing: '免费基础版',
                link: 'https://www.hailuo.ai',
                tips: '角色扮演和情感对话体验很好，适合创意写作'
            },
            {
                id: 'deepseek',
                name: 'DeepSeek',
                company: '深度求索',
                icon: '🔍',
                color: '#3B82F6',
                description: '专注通用人工智能，推出的代码和数学推理能力超强的模型。',
                features: [
                    '代码能力：接近GPT-4水平',
                    '数学推理：数学计算能力强',
                    '开源友好：开源模型可商用',
                    '性价比：API价格实惠'
                ],
                useCases: [
                    '代码生成和优化',
                    '数学问题求解',
                    '技术文档编写',
                    'AI编程助手'
                ],
                pricing: 'API价格极具性价比',
                link: 'https://www.deepseek.com',
                tips: '代码能力非常强，API价格便宜'
            }
        ];
        
        // Render Models
        function renderModels(filter = '') {
            const grid = document.getElementById('modelsGrid');
            grid.innerHTML = '';
            
            const filtered = models.filter(m => 
                m.name.toLowerCase().includes(filter.toLowerCase()) ||
                m.company.toLowerCase().includes(filter.toLowerCase()) ||
                m.description.toLowerCase().includes(filter.toLowerCase())
            );
            
            filtered.forEach(model => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.onclick = () => openModal(model);
                
                card.innerHTML = `
                    <div class="model-icon" style="background: ${model.color}20; color: ${model.color};">
                        ${model.icon}
                    </div>
                    <h3>${model.name}</h3>
                    <div class="company">${model.company}</div>
                    <p>${model.description}</p>
                    <div class="tags">
                        ${model.features.slice(0, 3).map(f => `<span class="tag">${f}</span>`).join('')}
                    </div>
                    <a href="${model.link}" target="_blank" class="model-link" onclick="event.stopPropagation()">
                        了解更多 →
                    </a>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // Modal Functions
        function openModal(model) {
            document.getElementById('modalTitle').textContent = `${model.icon} ${model.name}`;
            document.getElementById('modalCompany').textContent = model.company;
            document.getElementById('modalBody').innerHTML = `
                <div class="modal-section">
                    <h3>📝 模型介绍</h3>
                    <p>${model.description}</p>
                </div>
                
                <div class="modal-section">
                    <h3>✨ 核心特性</h3>
                    <div class="feature-grid">
                        ${model.features.map(f => `
                            <div class="feature-item">
                                <h4>${f.split('：')[0]}</h4>
                                <p>${f.split('：')[1]}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="modal-section">
                    <h3>🎯 适用场景</h3>
                    <ul>
                        ${model.useCases.map(uc => `<li>${uc}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="modal-section">
                    <h3>💰 定价方式</h3>
                    <div class="pricing-card">
                        <p style="margin-bottom: 10px;">${model.company} ${model.name}</p>
                        <div class="price">${model.pricing.split('/')[0]}</div>
                        <p style="margin-top: 15px; font-size: 14px;">${model.pricing.split('/')[1] || ''}</p>
                    </div>
                </div>
                
                <div class="modal-section">
                    <h3>💡 使用建议</h3>
                    <p style="color: #00d4ff;">${model.tips}</p>
                </div>
                
                <div class="modal-section">
                    <h3>🔗 官方链接</h3>
                    <a href="${model.link}" target="_blank" class="btn btn-primary" style="text-decoration: none;">
                        立即体验 ${model.name} →
                    </a>
                </div>
            `;
            
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // Close modal on backdrop click
        document.getElementById('modal').onclick = function(e) {
            if (e.target === this) closeModal();
        };
        
        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            renderModels(e.target.value);
        });
        
        // Initial render
        renderModels();
    </script>
</body>
</html>
